  important: true
  name: size
  options: [xsmall, small, medium, large, xlarge]
  type: enum
- {default_value: true, description: 'If True, the button can be clicked.', group: Interaction, important: true, name: enabled, type: boolean}
- {default_value: true, description: 'If True, the component will be displayed.', designer_hint: visible, group: Look and Feel, important: true, name: visible, type: boolean}
