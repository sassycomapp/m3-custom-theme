components: []
container:
  properties:
    html: |-
      <div anvil-name="m3x-dialog" class="m3x-dialog" role="dialog" aria-modal="true"><button anvil-name="m3x-dialog-close" class="m3x-dialog-close" type="button" aria-label="Close"><i class="material-symbols-outlined" aria-hidden="true">close</i></button><i anvil-name="m3x-dialog-icon" class="m3x-dialog-icon material-symbols-outlined" aria-hidden="true" style="display: none;"></i><h2 anvil-name="m3x-dialog-headline" class="m3x-dialog-headline" style="display: none;"></h2><div anvil-name="m3x-dialog-supporting-text" class="m3x-dialog-supporting-text" style="display: none;"></div><div anvil-slot="dialog-content-slot" class="m3x-dialog-content"></div><div anvil-slot="dialog-actions-slot" class="m3x-dialog-actions"></div></div>
  type: HtmlTemplate
custom_component: true
custom_component_container: true
events:
- {default_event: true, description: When the Dialog is shown on the screen., name: show}
- {description: When the Dialog is removed from the screen., name: hide}
is_package: true
properties:
- {default_value: '', description: The headline (title) of the Dialog., group: Key Properties, important: true, name: headline, type: string}
- {default_value: '', description: The supporting text below the headline., group: Key Properties, important: true, name: supporting_text, type: string}
- default_value: ''
  description: An icon shown above the headline. Basic dialogs only.
  group: Key Properties
  iconsets: [material-icons]
  important: true
  name: icon
  type: icon
- {default_value: false, description: 'If True, the Dialog fills the whole screen, with a close button and the actions in a top bar.', group: Key Properties, important: true, name: full_screen, type: boolean}
- {default_value: true, description: 'If True, the user can dismiss the Dialog by clicking outside it or pressing Escape. show() then returns None.', group: Interaction, important: true, name: dismissible, type: boolean}
- {default_binding_prop: true, default_value: true, description: 'If True, the component will be displayed.', designer_hint: visible, group: Look and Feel, important: true, name: visible, type: boolean}
- {default_value: '', description: A style for this component defined in CSS and added to Roles., group: Look and Feel, name: role, type: themeRole}
- {description: Use this property to store any extra data for the component., group: Other, important: false, name: tag, type: object}
toolbox_item:
  hidden: true
  icon: {dark: 'asset:designer_icons/dialog_dark.svg', light: 'asset:designer_icons/dialog.svg'}
